# Central configuration. Every module reads this; nothing hardcodes these.

harness:
  binary: harness/build/toml_harness
  timeout_seconds: 5          # assignment constraint: per-input timeout
  max_input_bytes: 1048576    # must match MAX_INPUT in toml_harness.c

  # Exit-code contract from Module 2. Changing these here without changing
  # the C file will silently misclassify every run.
  exit_accept: 0
  exit_reject: 2
  exit_usage: 64
  exit_sanitizer: 86

run:
  max_examples: 500           # assignment constraint: per iteration
  wall_clock_cap_seconds: 600 # assignment constraint: 10 min backstop

loop:
  max_iterations: 5           # assignment constraint
  acceptance_rate_floor: 0.20 # below this, the generator is broken (Module 5)

llm:
  base_url: auto
  model: qwen2.5-coder:7b
  temperature: 0.3            # low: we want valid Python, not creativity
  num_ctx: 16384
  request_timeout_seconds: 300

  # 7B-model reliability budget. Each attempt re-prompts with the previous
  # failure quoted back. 4 is empirical: attempts 1-2 fail often on
  # formatting, by 3-4 the quoted error usually fixes it.
  max_attempts: 8
  # Examples drawn from a candidate strategy during validation gate 5.
  validation_samples: 25
  # Inputs actually run through the harness during validation gate 6.
  validation_probe_examples: 40

  # Which backend agent/seed.py uses when --provider isn't passed on the
  # command line. ollama | groq | gemini. Originally groq: qwen2.5-coder:7b
  # kept hitting a real reliability ceiling (see OBSERVATIONS.md Case 1)
  # that Groq's larger model didn't hit as often (Case 2). Then
  # llama-3.3-70b-versatile was removed from Groq's lineup entirely
  # (2026-08-18, confirmed via GET /openai/v1/models). Its replacement,
  # openai/gpt-oss-120b, works but every currently-active Groq model
  # (gpt-oss-120b, gpt-oss-20b, qwen/qwen3.6-27b) shares the same 8,000
  # tokens-per-minute free-tier ceiling - too small for this project's
  # ~8,000-9,500 token prompts once STRATEGY_CONTRACT grew past rule 13 or
  # so. Switched default to gemini: its free tier gives ~250,000 TPM,
  # confirmed live against a real full-size prompt, not just read from
  # docs. --provider on the command line always overrides this.
  provider: openai
  # openai/gpt-oss-120b, kept as the groq fallback if gemini also needs
  # replacing later. Re-check `curl https://api.groq.com/openai/v1/models
  # -H "Authorization: Bearer $GROQ_API_KEY"` if this one also disappears.
  groq_model: openai/gpt-oss-120b
  # gemini-2.5-flash was retired; gemini-3.6-flash is the model Google's
  # own 404 error suggested as the replacement, confirmed working live
  # (clean single fenced code block, no reasoning leaking into content).
  # Re-check `curl "https://generativelanguage.googleapis.com/v1beta/models
  # ?key=$GEMINI_API_KEY"` if this one also gets retired later.
  gemini_model: gemini-3.6-flash
  openai_model: gpt-5.6-luna

paths:
  logs: pipeline/logs
  state: agent/state
  crashes: triage/reports
  strategies: agent/strategies
  prompts: agent/state/prompts


features:
  # Depth buckets reported to the model. The top bucket is deliberately far
  # beyond anything a normal document reaches - the known stack-overflow
  # needs ~48k, so "deep" here means "heading in that direction", not "safe".
  depth_buckets: [0, 1, 2, 3, 5, 8, 16, 32, 64]
  # Reject messages shown back to the model per iteration.
  top_reject_messages: 5
  # Productions listed as "missing" in one prompt. Listing all 30 produces a
  # scattershot retry; 8 produces a focused one.
  max_missing_shown: 8

triage:
  # Frames kept in a signature, after normalization. 5 is the usual choice:
  # enough to separate distinct bugs, few enough that an unrelated deeper
  # call path does not split one bug into several.
  signature_frames: 5
  # Collapse runs of identical consecutive frames before hashing. Required
  # for recursion bugs - see the planning doc.
  collapse_recursive_frames: true
  # Ignore frames from our own harness; bucket on library frames only.
  ignore_frame_patterns:
    - "toml_harness"
    - "__asan"
    - "__ubsan"
    - "__sanitizer"   # e.g. __sanitizer::BufferedStackTrace::UnwindImpl -
                       # ASan's own stack-unwinding internals, not our code
    - "libc_start"
    - "_start"
  # Times a minimized reproducer must crash in a row to be called deterministic.
  verify_runs: 3
  # Safety cap on minimization work.
  minimize_max_steps: 400